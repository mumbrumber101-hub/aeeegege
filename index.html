<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reefs of Earth Reader's Maps</title>
<style>html,body{height:100%;margin:0;background:#f5f6f1;color:#1c1f1b;font:16px Georgia,serif}main{padding:24px}button{font:inherit;padding:8px 14px;cursor:pointer}[hidden]{display:none}</style>
</head>
<body>
<main><p id="load-status" role="status">Loading the reader’s maps…</p><button id="retry" type="button" hidden>Reload map</button><noscript>Please enable JavaScript to use the interactive map.</noscript></main>
<script>
(async function () {
  const patch = "/* Keep scene notes in the reading panel, clear of the map. */\n(function () {\n  'use strict';\n  const panel = document.getElementById('panel');\n  const card = document.getElementById('card');\n  const closeButton = document.getElementById('cardx');\n  if (!panel || !card || !closeButton || document.getElementById('map-controls')) return;\n\n  const style = document.createElement('style');\n  style.id = 'notes-panel-style';\n  style.textContent = `\n    .panel { overflow-anchor: none; }\n    #map-controls { display: flex; flex-direction: column; gap: 22px; min-width: 0; flex: 0 0 auto; }\n    #map-controls[hidden] { display: none !important; }\n    #panel > #card {\n      position: relative; inset: auto; width: 100%; max-width: none; max-height: none;\n      overflow: visible; flex: 0 0 auto; padding: 12px; margin: 0;\n      box-shadow: none; cursor: auto;\n    }\n    #card .note-actions {\n      display: flex; flex-direction: column; gap: 8px;\n      position: sticky; top: -14px; z-index: 2;\n      margin: -12px -12px 12px; padding: 10px 12px;\n      background: var(--panel); border-bottom: 1px solid var(--rule);\n    }\n    #card .note-actions .x {\n      position: static; width: auto; height: auto; align-self: flex-start;\n      padding: 6px 8px; min-height: 36px; border: 1px solid var(--rule);\n      border-radius: 3px; background: var(--paper); color: var(--ink);\n      font-size: 13px; line-height: 1.3; text-align: left;\n    }\n    #card .note-navigation { display: flex; flex-wrap: wrap; gap: 6px; }\n    #card .note-navigation[hidden] { display: none !important; }\n    #card .note-navigation button { min-height: 36px; }\n    #card #cardh { margin-bottom: 6px; }\n    @media (max-width: 600px) {\n      #card .note-actions button { min-height: 40px; }\n    }\n  `;\n  document.head.appendChild(style);\n\n  const controls = document.createElement('div');\n  controls.id = 'map-controls';\n  while (panel.firstChild) controls.appendChild(panel.firstChild);\n  panel.append(controls, card);\n  card.setAttribute('role', 'region');\n  card.setAttribute('aria-labelledby', 'cardh');\n  closeButton.textContent = 'Back to map controls';\n  closeButton.setAttribute('aria-label', 'Close note and return to map controls');\n\n  const actions = document.createElement('div');\n  actions.className = 'note-actions';\n  const navigation = document.createElement('div');\n  navigation.className = 'note-navigation steps';\n  navigation.hidden = true;\n  const previous = document.createElement('button');\n  previous.id = 'note-prev'; previous.type = 'button';\n  const next = document.createElement('button');\n  next.id = 'note-next'; next.type = 'button';\n  navigation.append(previous, next);\n  actions.append(closeButton, navigation);\n  card.prepend(actions);\n\n  let open = false;\n  let controlsScroll = panel.scrollTop;\n  let noteKey = '';\n  let returnTarget = null;\n  let restoreFocus = false;\n\n  function describeTarget(target) {\n    if (!target || target === document.body) return { id: 'viewer' };\n    const item = target.closest && target.closest('.list li');\n    if (item && item.parentElement.id) {\n      return { list: item.parentElement.id, index: Array.from(item.parentElement.children).indexOf(item) };\n    }\n    if (target.closest && target.closest('#viewer')) return { id: 'viewer' };\n    return target.id ? { id: target.id } : { id: 'viewer' };\n  }\n\n  document.addEventListener('click', function (event) {\n    if (open) return;\n    const target = event.target.closest && event.target.closest('.item,.mk,.vs,[data-route],#vprev,#vnext');\n    if (target) {\n      controlsScroll = panel.scrollTop;\n      returnTarget = describeTarget(target);\n    }\n  }, true);\n\n  function returnFocus() {\n    let target = null;\n    if (returnTarget && returnTarget.list) {\n      const list = document.getElementById(returnTarget.list);\n      target = list && list.children[returnTarget.index] && list.children[returnTarget.index].querySelector('button');\n    } else if (returnTarget) target = document.getElementById(returnTarget.id);\n    (target || document.getElementById('viewer')).focus({ preventScroll: true });\n  }\n\n  function updatePanel() {\n    const visible = !card.hidden;\n    const key = visible ? (state.sel ? 'place:' + state.sel : state.vstep >= 0 ? 'voyage:' + state.vstep : 'route:' + state.route) : '';\n    if (visible) {\n      if (!open) {\n        controlsScroll = panel.scrollTop;\n        if (!returnTarget) returnTarget = describeTarget(document.activeElement);\n      }\n      const voyage = !state.sel && state.vstep >= 0;\n      const route = !state.sel && state.route >= 0;\n      navigation.hidden = !voyage && !route;\n      previous.textContent = voyage ? 'Previous stop' : 'Previous leg';\n      next.textContent = voyage ? 'Next stop' : 'Next leg';\n      const index = voyage ? state.vstep : state.route;\n      const total = voyage ? DATA.voyage.length : DATA.vroutes.length;\n      previous.disabled = index \u003c= 0;\n      next.disabled = index >= total - 1;\n      controls.hidden = true;\n      if (!open || key !== noteKey) panel.scrollTop = 0;\n      if (!open) closeButton.focus({ preventScroll: true });\n    } else if (open) {\n      controls.hidden = false;\n      panel.scrollTop = controlsScroll;\n      if (restoreFocus) returnFocus();\n      returnTarget = null;\n    }\n    open = visible;\n    noteKey = key;\n    restoreFocus = false;\n  }\n\n  const originalRenderCard = renderCard;\n  renderCard = function () {\n    originalRenderCard();\n    updatePanel();\n  };\n  const originalClose = closeButton.onclick;\n  closeButton.onclick = function () {\n    restoreFocus = true;\n    originalClose();\n  };\n  previous.onclick = function () {\n    if (state.vstep >= 0) voyageTo(Math.max(0, state.vstep - 1));\n    else if (state.route >= 0) routeTo(Math.max(0, state.route - 1));\n  };\n  next.onclick = function () {\n    if (state.vstep >= 0) voyageTo(Math.min(DATA.voyage.length - 1, state.vstep + 1));\n    else if (state.route >= 0) routeTo(Math.min(DATA.vroutes.length - 1, state.route + 1));\n  };\n  document.addEventListener('keydown', function (event) {\n    if (event.key === 'Escape' && open) {\n      event.preventDefault();\n      closeButton.click();\n    }\n  });\n  updatePanel();\n})();\n";
  const retry = document.getElementById('retry');
  retry.onclick = () => location.reload();
  try {
    const response = await fetch(new URL('map-source.html?v=39c1f62f0d53f19bf843e9c7c531f2c82e970421', location.href));
    if (!response.ok) throw new Error('Map source could not be loaded');
    let source = await response.text();
    const punctuationCorrections = [["adapt to Earth, and wonders", "adapt to Earth and wonders"], ["Charles fires as he drops and Marshall falls dead", "Charles fires as he drops, and Marshall falls dead"], ["when Crocker's hounds strike his trail a young engineer", "when Crocker's hounds strike his trail, a young engineer"], ["Amada Stutgard escapes from the building and Peter pursues her into the hills.", "Amada Stutgard escapes from the building, and Peter pursues her into the hills."]];
    for (const [before, after] of punctuationCorrections) source = source.split(before).join(after);
    const end = source.toLowerCase().lastIndexOf('</body>');
    if (end < 0 || !source.includes('id="card"')) throw new Error('Map source is incomplete');
    const revised = source.slice(0, end) + '<script id="notes-panel-patch">' + patch + '<' + '/script>\n' + source.slice(end);
    document.open();
    document.write(revised);
    document.close();
  } catch (error) {
    document.getElementById('load-status').textContent = 'The map could not be loaded. Please try reloading it.';
    retry.hidden = false;
  }
})();
</script>
</body>
</html>
